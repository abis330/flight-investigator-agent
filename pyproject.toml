[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightinvestigator"
version = "0.1.0"
description = "Multi-agent root-cause investigation of flight-test logs over MCP tools, with grounded evidence verification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "flightlake @ git+https://github.com//flightlake.git",
  "mcp>=1.6", "numpy>=1.26", "pandas>=2.1", "typer>=0.12", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
investigator = "flightinvestigator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
